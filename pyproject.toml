[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reactor-modeling-agent"
version = "0.1.0"
description = "Local AI-assisted chemical reactor modeling with Aspen HYSYS V15"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.8,<3",
  "pint>=0.24,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "openai>=1.50,<3",
  "mcp>=1.15,<2",
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
windows = ["pywin32>=306; platform_system == 'Windows'"]
test = ["pytest>=8.0,<10", "pytest-cov>=5,<8"]

[project.scripts]
reactor-agent = "reactor_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reactor_agent"]
include = ["reactor_agent/skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
